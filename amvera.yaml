meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: backend/requirements.txt

run:
  persistenceMount: /data
  containerPort: 8000
  command: sh -c "export PYTHONUNBUFFERED=1; echo START; cd backend && python manage.py collectstatic --noinput && echo STATIC_OK && (timeout 60 python manage.py migrate --noinput; echo MIGRATE_DONE); exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --error-logfile -"
