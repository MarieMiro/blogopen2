meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: backend/requirements.txt

run:
  persistenceMount: /data
  containerPort: 8000
  command: sh -c "echo START; cd backend && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --log-level debug --error-logfile -"
